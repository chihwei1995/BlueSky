<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 氣候行動介紹 | Blue Sky Returns</title>
  <style>
    :root {
      --bg: #eef6f0;
      --surface: rgba(255, 255, 255, 0.95);
      --surface-strong: #ffffff;
      --ink: #153126;
      --muted: #597068;
      --line: #d8e7dd;
      --forest: #1b7a55;
      --forest-deep: #12513a;
      --sky: #2aa6b5;
      --gold: #d7a72d;
      --shadow: 0 24px 54px rgba(21, 49, 38, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--ink);
      line-height: 1.7;
      background:
        radial-gradient(circle at top left, rgba(42, 166, 181, 0.16), transparent 22%),
        radial-gradient(circle at top right, rgba(139, 209, 102, 0.18), transparent 18%),
        linear-gradient(180deg, #f6fbf7 0%, var(--bg) 45%, #f8fcf9 100%);
    }

    button,
    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 20px 64px;
      display: grid;
      gap: 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .topbar-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex: 1 1 320px;
      min-width: 0;
    }
    .topbar-mobile-tools {
      display: none;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .brand {
      display: grid;
      gap: 4px;
    }

    .brand strong {
      color: var(--forest);
      font-size: 1rem;
    }

    .brand span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .lang-toggle {
      display: inline-flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-strong);
    }

    .lang-btn,
    .button,
    .slider-nav {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--forest);
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(27, 122, 85, 0.08);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .button,
    .slider-nav,
    .lang-btn {
      min-width: 0;
    }

    .lang-btn {
      padding: 8px 14px;
      background: transparent;
      color: var(--muted);
      box-shadow: none;
    }

    .lang-btn.active,
    .button.primary,
    .slider-nav.primary {
      background: linear-gradient(135deg, var(--forest), var(--sky));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 12px 28px rgba(27, 122, 85, 0.18);
    }
    .nav-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(255, 255, 255, 0.92);
      color: #16324f;
      font-size: 0.92rem;
      line-height: 1;
      letter-spacing: 0.01em;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      cursor: pointer;
    }
    @keyframes mobileNavFade {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .nav-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.24);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 1;
    }
    .nav-backdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      background: var(--surface);
      border: 1px solid rgba(216, 231, 221, 0.96);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .slideshow {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.78fr);
      gap: 22px;
      padding: 24px;
      align-items: start;
    }

    .slide-visual {
      display: grid;
      gap: 14px;
    }

    .slide-frame {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(21, 49, 38, 0.08);
      background: #f0f7f1;
      box-shadow: 0 18px 36px rgba(12, 48, 36, 0.12);
      touch-action: pan-y;
      user-select: none;
    }

    .slide-frame img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      background: #f0f7f1;
    }

    .slide-counter {
      position: absolute;
      top: 16px;
      left: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(16, 43, 34, 0.72);
      color: #fff;
      font-size: 0.88rem;
      font-weight: 900;
      backdrop-filter: blur(12px);
    }

    .slide-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .slide-nav-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .slider-nav {
      min-width: 110px;
    }

    .slide-dots {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .slide-dot {
      width: 12px;
      height: 12px;
      border: none;
      border-radius: 999px;
      padding: 0;
      background: rgba(27, 122, 85, 0.18);
      box-shadow: none;
      cursor: pointer;
    }

    .slide-dot.active {
      width: 32px;
      background: linear-gradient(135deg, var(--forest), var(--sky));
    }

    .slide-copy {
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .route-badge {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(42, 166, 181, 0.1);
      color: #0d7281;
      font-size: 0.84rem;
      font-weight: 900;
      max-width: 100%;
    }

    .slide-copy h2 {
      font-size: clamp(1.55rem, 2.8vw, 2.35rem);
      line-height: 1.12;
      color: var(--forest-deep);
      overflow-wrap: anywhere;
    }

    .slide-lead {
      color: var(--muted);
      font-size: 0.98rem;
    }

    .slide-points {
      display: grid;
      gap: 10px;
    }

    .slide-point {
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(250, 252, 250, 0.92);
      border: 1px solid rgba(21, 49, 38, 0.08);
      color: var(--forest-deep);
      font-weight: 700;
      line-height: 1.55;
    }

    .slide-step-label {
      color: var(--gold);
      font-size: 0.82rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      overflow-wrap: anywhere;
    }

    .slide-tip {
      padding: 16px 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(27, 122, 85, 0.08), rgba(42, 166, 181, 0.08));
      border: 1px solid rgba(27, 122, 85, 0.12);
      color: var(--forest-deep);
    }

    .slide-tip strong {
      display: block;
      margin-bottom: 4px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 4px;
    }

    @media (hover: hover) {
      .lang-btn:hover,
      .button:hover,
      .slider-nav:hover {
        transform: translateY(-1px);
        border-color: rgba(27, 122, 85, 0.32);
      }
    }

    @media (max-width: 980px) {
      .slideshow {
        grid-template-columns: 1fr;
      }

      .slide-copy {
        order: -1;
      }
    }

    @media (max-width: 860px) {
      .shell {
        padding: 18px 14px 42px;
      }

      .panel,
      .slideshow {
        padding: 18px;
        border-radius: 22px;
      }

      .topbar-actions {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
      }

      .topbar-actions .button,
      .topbar-actions .lang-toggle {
        width: 100%;
      }
    }

    @media (max-width: 640px) {
      .shell {
        gap: 16px;
        padding: calc(14px + env(safe-area-inset-top)) 16px 32px;
      }

      .topbar {
        gap: 8px;
      }
      .topbar-primary {
        gap: 10px;
        min-height: 42px;
      }
      .topbar-mobile-tools {
        display: flex;
        gap: 8px;
      }
      .topbar-mobile-tools .lang-toggle { gap: 4px; padding: 3px; }
      .topbar-mobile-tools .lang-btn { min-width: 42px; min-height: 42px; padding: 7px 0; font-size: 0.82rem; }
      .nav-toggle {
        display: inline-flex;
      }

      .brand span {
        font-size: 0.82rem;
      }
      .brand strong {
        display: none;
      }
      .brand { flex: 0 0 auto; }
      .topbar-mobile-tools { gap: 6px; margin-left: 0; }
      .topbar-actions {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        margin-top: 10px;
        padding: 14px;
        border-radius: 20px;
        border: 1px solid rgba(226, 232, 240, 0.84);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.96));
        box-shadow: 0 20px 44px rgba(15, 23, 42, 0.14);
        backdrop-filter: blur(12px);
      }
      .topbar.nav-open .topbar-actions {
        display: flex;
        animation: mobileNavFade 0.22s ease both;
      }
      .topbar-actions .lang-toggle {
        display: none;
      }
      .topbar-actions .button {
        min-height: 46px;
        padding: 12px 14px;
        border-radius: 16px;
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.2;
        transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
      }
      .topbar-actions .button:hover,
      .topbar-actions .button.primary {
        background: linear-gradient(135deg, var(--forest), var(--sky));
        border-color: transparent;
        color: #fff;
        box-shadow: 0 12px 24px rgba(27, 122, 85, 0.18);
        transform: translateY(-1px);
      }

      .lang-btn {
        flex: 1 1 0;
      }

      .slideshow {
        gap: 16px;
      }

      .slide-frame img {
        aspect-ratio: 4 / 5.35;
      }

      .slide-counter {
        top: 12px;
        left: 12px;
        padding: 7px 10px;
        font-size: 0.8rem;
      }

      .slide-controls {
        align-items: stretch;
        justify-content: stretch;
      }

      .slide-nav-group {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .slider-nav {
        width: 100%;
        min-width: 0;
        padding: 10px 12px;
        font-size: 0.92rem;
      }

      .slide-dots {
        width: 100%;
        justify-content: center;
      }

      .route-badge,
      .slide-step-label {
        width: 100%;
      }

      .slide-copy {
        gap: 14px;
      }

      .slide-copy h2 {
        font-size: clamp(1.3rem, 6.6vw, 1.7rem);
      }

      .slide-lead,
      .slide-point,
      .slide-tip {
        font-size: 0.92rem;
      }

      .slide-point,
      .slide-tip {
        padding: 13px 14px;
      }

      .actions .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="topbar-primary">
        <div class="brand">
          <strong>Blue Sky Returns</strong>
          <span data-i18n="brand.subtitle">2026 氣候行動介紹</span>
        </div>
        <div class="topbar-mobile-tools">
          <div class="lang-toggle" aria-label="Language switcher">
            <button class="lang-btn" type="button" data-lang="zh">中</button>
            <button class="lang-btn" type="button" data-lang="en">EN</button>
          </div>
          <button id="navToggleBtn" class="nav-toggle" type="button" aria-expanded="false">Menu / 選單</button>
        </div>
      </div>
      <div id="navActions" class="topbar-actions">
        <div class="lang-toggle" aria-label="Language switcher">
          <button class="lang-btn" type="button" data-lang="zh">中</button>
          <button class="lang-btn" type="button" data-lang="en">EN</button>
        </div>
        <a class="button" id="backLink" href="./eco-mbti.html" data-i18n="nav.back">返回 Eco-MBTI</a>
      </div>
    </div>
    <div id="navBackdrop" class="nav-backdrop" aria-hidden="true"></div>

    <section class="panel slideshow">
      <div class="slide-visual">
        <div class="slide-frame" id="slideFrame">
          <div class="slide-counter">
            <span id="slideCounter">1 / 6</span>
          </div>
          <img id="slideImage" src="../assets/climate-action-slides/2.png" alt="Climate Action slide" />
        </div>

        <div class="slide-controls">
          <div class="slide-nav-group">
            <button id="prevSlideBtn" class="slider-nav" type="button" data-i18n="slider.prev">上一張</button>
            <button id="nextSlideBtn" class="slider-nav primary" type="button" data-i18n="slider.next">下一張</button>
          </div>
          <div id="slideDots" class="slide-dots" aria-label="Slide navigation"></div>
        </div>
      </div>

      <div class="slide-copy">
        <span class="route-badge" id="slideBadge">九龍綠建築探索篇</span>

        <p class="slide-lead" id="slideBody">每一張圖都代表活動中的一個重點，讓使用者知道這不是只有線上測驗，而是可以延伸到真實世界的氣候行動。</p>

        <div id="slidePoints" class="slide-points"></div>

        <div class="slide-tip">
          <strong data-i18n="tip.title">看完就可以做什麼？</strong>
          <span data-i18n="tip.body">完成測驗後，你可以再回到活動頁，依照這些路線與任務去參與、拍照、分享與集氣。</span>
        </div>

        <div class="actions">
          <a class="button primary" href="./green-action-7day.html" data-i18n="actions.join">立即參與</a>
          <a class="button" id="laterLink" href="./eco-mbti.html" data-i18n="actions.later">稍後再看</a>
        </div>
      </div>
    </section>
  </main>

            badge: "Discover Green Hong Kong",
            title: "Next, explain the deeper meaning behind the event",
            body: "This slide is less about rewards and more about perspective: seeing, understanding, participating, and creating wider impact.",
            points: [
              "It reframes the campaign as a way to understand the city and climate.",
              "The four-stage structure gives users a clear emotional and learning path.",
              "It is a strong middle slide for brand storytelling."
            ]
          },
          {
            badge: "Shared Goal & Momentum",
            title: "End with the collective result users contribute to",
            body: "The last slide links registrations, mission check-ins, shared momentum, and tree planting, showing users that their actions roll up into a larger community outcome.",
            points: [
              "It connects individual actions to a visible group result.",
              "It works well as the closing slide for motivation and urgency.",
              "It naturally leads back into joining, sharing, or returning to the campaign."
            ]
          }
        ]
      }
    };

    const SLIDE_IMAGES = [
      "../assets/climate-action-slides/2.png",
      "../assets/climate-action-slides/3.png",
      "../assets/climate-action-slides/4.png",
      "../assets/climate-action-slides/5.png",
      "../assets/climate-action-slides/6.png",
      "../assets/climate-action-slides/7.png"
    ];

    const params = new URLSearchParams(window.location.search);
    const requestedLang = params.get("lang");
    const savedLang = localStorage.getItem(LANG_STORAGE_KEY);
    let currentLang = requestedLang === "en" || requestedLang === "zh"
      ? requestedLang
      : (savedLang === "en" || savedLang === "zh" ? savedLang : "zh");
    let currentSlideIndex = 0;

    const slideImage = document.getElementById("slideImage");
    const slideCounter = document.getElementById("slideCounter");
    const slideBadge = document.getElementById("slideBadge");
    const slideStepLabel = document.getElementById("slideStepLabel");
    const slideTitle = document.getElementById("slideTitle");
    const slideBody = document.getElementById("slideBody");
    const slidePoints = document.getElementById("slidePoints");
    const slideDots = document.getElementById("slideDots");
    const slideFrame = document.getElementById("slideFrame");
    const prevSlideBtn = document.getElementById("prevSlideBtn");
    const nextSlideBtn = document.getElementById("nextSlideBtn");
    const backLink = document.getElementById("backLink");
    const laterLink = document.getElementById("laterLink");

    const t = (path) => path.split(".").reduce((acc, key) => acc?.[key], I18N[currentLang]) || "";
    const getSlides = () => I18N[currentLang].slides;

    const renderDots = () => {
      slideDots.innerHTML = "";
      getSlides().forEach((slide, index) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = `slide-dot${index === currentSlideIndex ? " active" : ""}`;
        dot.setAttribute("aria-label", `${slide.badge} ${index + 1}`);
        dot.addEventListener("click", () => {
          currentSlideIndex = index;
          renderSlide();
        });
        slideDots.appendChild(dot);
      });
    };

    const renderSlide = () => {
      const slides = getSlides();
      const slide = slides[currentSlideIndex];
      slideImage.src = SLIDE_IMAGES[currentSlideIndex];
      slideImage.alt = slide.badge;
      slideCounter.textContent = `${currentSlideIndex + 1} / ${slides.length}`;
      slideBadge.textContent = slide.badge;
      slideStepLabel.textContent = `${t("slider.stepLabel")} ${currentSlideIndex + 1}`;
      slideTitle.textContent = slide.title;
      slideBody.textContent = slide.body;
      slidePoints.innerHTML = "";
      slide.points.forEach((point) => {
        const item = document.createElement("div");
        item.className = "slide-point";
        item.textContent = point;
        slidePoints.appendChild(item);
      });
      prevSlideBtn.disabled = currentSlideIndex === 0;
      nextSlideBtn.disabled = currentSlideIndex === slides.length - 1;
      renderDots();
    };

    const applyLanguage = (lang) => {
      currentLang = lang === "en" ? "en" : "zh";
      localStorage.setItem(LANG_STORAGE_KEY, currentLang);
      document.documentElement.lang = currentLang === "zh" ? "zh-Hant" : "en";
      document.title = t("pageTitle");

      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.getAttribute("data-i18n");
        node.textContent = t(key);
      });

      document.querySelectorAll(".lang-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === currentLang);
      });

      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set("lang", currentLang);
      window.history.replaceState({}, "", nextUrl);

      const backHref = `./eco-mbti.html?lang=${currentLang}`;
      backLink.href = backHref;
      laterLink.href = backHref;
      renderSlide();
    };

    prevSlideBtn.addEventListener("click", () => {
      if (currentSlideIndex === 0) return;
      currentSlideIndex -= 1;
      renderSlide();
    });

    nextSlideBtn.addEventListener("click", () => {
      if (currentSlideIndex >= getSlides().length - 1) return;
      currentSlideIndex += 1;
      renderSlide();
    });

    document.querySelectorAll(".lang-btn").forEach((button) => {
      button.addEventListener("click", () => applyLanguage(button.dataset.lang));
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") prevSlideBtn.click();
      if (event.key === "ArrowRight") nextSlideBtn.click();
    });

    let touchStartX = 0;
    let touchEndX = 0;

    slideFrame.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0]?.clientX || 0;
    }, { passive: true });

    slideFrame.addEventListener("touchend", (event) => {
      touchEndX = event.changedTouches[0]?.clientX || 0;
      const deltaX = touchEndX - touchStartX;
      if (Math.abs(deltaX) < 42) return;
      if (deltaX < 0) nextSlideBtn.click();
      else prevSlideBtn.click();
    }, { passive: true });

    applyLanguage(currentLang);
  </script>
  <script>
    (() => {
      const topbar = document.querySelector(".topbar");
      const navActions = document.getElementById("navActions");
      const navToggleBtn = document.getElementById("navToggleBtn");
      const navBackdrop = document.getElementById("navBackdrop");
      if (!topbar || !navActions || !navToggleBtn) return;
      const setNavToggleLabel = (isOpen) => {
        navToggleBtn.textContent = isOpen ? "Close / 關閉" : "Menu / 選單";
      };
      const closeMobileNav = () => {
        topbar.classList.remove("nav-open");
        navToggleBtn.setAttribute("aria-expanded", "false");
        navBackdrop?.classList.remove("is-visible");
        setNavToggleLabel(false);
      };
      navToggleBtn.addEventListener("click", () => {
        const isOpen = !topbar.classList.contains("nav-open");
        topbar.classList.toggle("nav-open", isOpen);
        navToggleBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
        navBackdrop?.classList.toggle("is-visible", isOpen);
        setNavToggleLabel(isOpen);
      });
      navActions.querySelectorAll("a, button").forEach((item) => item.addEventListener("click", closeMobileNav));
      navBackdrop?.addEventListener("click", closeMobileNav);
      window.addEventListener("resize", () => {
        if (window.innerWidth > 640) closeMobileNav();
      });
      setNavToggleLabel(false);
    })();
  </script>
</body>
</html>
