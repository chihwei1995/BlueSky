<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision Board | Blue Sky Returns</title>
  <link rel="icon" type="image/png" href="/Enter.PNG" />
  <link rel="shortcut icon" type="image/png" href="/Enter.PNG" />
  <link rel="apple-touch-icon" href="/Enter.PNG" />
  <meta name="description" content="Explore an interactive decision board experience and discover your next Blue Sky Returns action path." />
  <style>
    :root {
      --paper: #f7f0e6;
      --paper-ink: #3f2a24;
      --board: #c93a2e;
      --board-deep: #97271d;
      --board-line: #621713;
      --accent: #1e7f5b;
      --accent-soft: #def2e7;
      --gold: #d9a441;
      --card: rgba(255, 250, 245, 0.88);
      --line: rgba(87, 58, 48, 0.14);
      --shadow: 0 24px 56px rgba(79, 45, 32, 0.14);
      --menu-shadow: 0 20px 44px rgba(15, 23, 42, 0.14);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--paper-ink);
      background:
        radial-gradient(circle at top left, rgba(217, 164, 65, 0.16), transparent 20%),
        radial-gradient(circle at top right, rgba(201, 58, 46, 0.12), transparent 16%),
        linear-gradient(180deg, #fbf6ef 0%, #f6efe5 52%, #f4ecdf 100%);
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(14px);
      background: rgba(251, 246, 239, 0.9);
      border-bottom: 1px solid rgba(87, 58, 48, 0.08);
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      flex-wrap: nowrap;
    }

    .nav-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex: 1 1 auto;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
      padding: 5px;
      border: 1px solid rgba(87, 58, 48, 0.1);
      box-shadow: 0 10px 18px rgba(64, 42, 34, 0.1);
    }

    .brand-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand-copy strong {
      color: #234b3f;
      font-size: 1rem;
      letter-spacing: 0.03em;
    }

    .brand-copy span {
      color: rgba(63, 42, 36, 0.72);
      font-size: 0.84rem;
    }

    .nav-mobile-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      min-width: 0;
      justify-content: flex-end;
    }

    .pill,
    .button,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
      border-radius: 999px;
      border: 1px solid rgba(87, 58, 48, 0.12);
      background: rgba(255, 255, 255, 0.86);
      color: #244d41;
      padding: 10px 14px;
      font-size: 0.94rem;
      line-height: 1.35;
      text-align: center;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .pill:hover,
    .button:hover,
    button:hover {
      transform: translateY(-1px);
      border-color: rgba(30, 127, 91, 0.3);
      box-shadow: 0 10px 22px rgba(30, 127, 91, 0.12);
    }

    .pill.active,
    .button.primary,
    button.primary {
      background: linear-gradient(135deg, #1e7f5b, #51aa89);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 12px 24px rgba(30, 127, 91, 0.18);
    }

    .lang-toggle {
      display: inline-flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid rgba(87, 58, 48, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: rgba(63, 42, 36, 0.68);
      padding: 7px 12px;
      border-radius: 999px;
      font-weight: 700;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, #1e7f5b, #51aa89);
      color: #fff;
      box-shadow: 0 8px 18px rgba(30, 127, 91, 0.16);
    }

    .nav-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(255, 255, 255, 0.92);
      color: #16324f;
      font-size: 0.92rem;
      line-height: 1;
      letter-spacing: 0.01em;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      white-space: nowrap;
    }

    @keyframes mobileNavFade {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nav-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.24);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 29;
    }

    .nav-backdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    main {
      padding: 28px 0 56px;
    }

    .hero {
      display: grid;
      gap: 14px;
      padding: 24px 28px;
      border-radius: 28px;
      background:
        radial-gradient(circle at 88% 12%, rgba(255, 255, 255, 0.34), transparent 18%),
        linear-gradient(135deg, rgba(245, 228, 201, 0.98), rgba(252, 247, 241, 0.92));
      border: 1px solid rgba(87, 58, 48, 0.08);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(201, 58, 46, 0.08);
      color: #8a241c;
      border: 1px solid rgba(201, 58, 46, 0.12);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.6rem);
      line-height: 1.02;
      color: #4c261d;
      max-width: 12ch;
    }

    .hero p {
      margin: 0;
      max-width: 62ch;
      color: rgba(63, 42, 36, 0.8);
      font-size: 1rem;
    }

    .logo-showcase {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 6px;
    }

    .logo-showcase-card {
      display: grid;
      align-items: center;
      justify-items: center;
      min-height: 132px;
      padding: 16px 18px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(87, 58, 48, 0.08);
      box-shadow: 0 14px 30px rgba(79, 45, 32, 0.08);
      overflow: hidden;
    }

    .logo-showcase-card img {
      width: 100%;
      height: 72px;
      object-fit: contain;
      object-position: center;
      display: block;
      filter: saturate(1.02) contrast(1.02);
    }

    .experience-grid {
      display: grid;
      grid-template-columns: minmax(360px, 460px) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .panel {
      border-radius: 28px;
      background: var(--card);
      border: 1px solid rgba(87, 58, 48, 0.08);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
    }

    .board-panel {
      padding: 18px;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 20%),
        linear-gradient(180deg, rgba(161, 28, 20, 0.08), rgba(0, 0, 0, 0) 20%),
        #f7ede2;
      position: sticky;
      top: 94px;
    }

    .board-frame {
      padding: 18px;
      border-radius: 32px;
      background: linear-gradient(180deg, #d84839, #b92d22);
      border: 3px solid rgba(90, 18, 14, 0.35);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, 0.18),
        inset 0 -8px 18px rgba(61, 10, 7, 0.18),
        0 26px 50px rgba(93, 32, 24, 0.24);
      position: relative;
      aspect-ratio: 0.78;
      overflow: hidden;
    }

    .board-title {
      position: absolute;
      top: 18px;
      right: 24px;
      color: rgba(54, 8, 7, 0.8);
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      z-index: 2;
    }

    .board-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .board-token {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #fff7d6 0%, #f1ca6f 40%, #ba7d13 100%);
      box-shadow:
        0 6px 14px rgba(62, 17, 12, 0.26),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(101, 50, 4, 0.4);
      transform: translate(-50%, -50%);
      transition: left 0.42s cubic-bezier(0.22, 1, 0.36, 1), top 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 3;
    }

    .board-legend {
      position: absolute;
      bottom: 18px;
      left: 18px;
      right: 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      z-index: 2;
    }

    .legend-chip {
      display: grid;
      gap: 4px;
      justify-items: center;
      padding: 10px 8px;
      border-radius: 18px;
      background: rgba(81, 10, 8, 0.16);
      color: #fff8f3;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(6px);
      text-align: center;
    }

    .legend-chip strong {
      font-size: 1rem;
      line-height: 1;
    }

    .legend-chip span {
      font-size: 0.76rem;
      opacity: 0.88;
      line-height: 1.25;
    }

    .control-panel {
      display: grid;
      gap: 16px;
      padding: 22px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status-badge,
    .mini-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #14553e;
      border: 1px solid rgba(30, 127, 91, 0.12);
      font-weight: 800;
      font-size: 0.84rem;
    }

    .mini-badge {
      background: rgba(217, 164, 65, 0.12);
      color: #875713;
      border-color: rgba(217, 164, 65, 0.16);
    }

    .question-card {
      display: grid;
      gap: 18px;
      padding: 22px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(252, 247, 241, 0.9));
      border: 1px solid rgba(87, 58, 48, 0.08);
      min-width: 0;
    }

    .question-copy {
      display: grid;
      gap: 8px;
    }

    .question-copy h2,
    .result-panel h2 {
      margin: 0;
      font-size: clamp(1.5rem, 2.6vw, 2.2rem);
      line-height: 1.08;
      color: #4c261d;
    }

    .question-copy p,
    .result-panel p {
      margin: 0;
      color: rgba(63, 42, 36, 0.76);
    }

    .choice-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .choice-btn {
      display: grid;
      gap: 6px;
      align-content: start;
      justify-items: start;
      min-height: 150px;
      padding: 18px;
      border-radius: 24px;
      border: 1px solid rgba(87, 58, 48, 0.1);
      background: rgba(255, 255, 255, 0.88);
      color: #27473d;
      text-align: left;
      box-shadow: 0 12px 28px rgba(79, 45, 32, 0.06);
    }

    .choice-btn:hover {
      border-color: rgba(30, 127, 91, 0.28);
      box-shadow: 0 16px 30px rgba(30, 127, 91, 0.12);
    }

    .choice-btn strong {
      font-size: 1.06rem;
      color: #173f34;
    }

    .choice-btn span {
      font-size: 0.92rem;
      line-height: 1.45;
      color: rgba(39, 71, 61, 0.78);
    }

    .path-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .path-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(201, 58, 46, 0.08);
      border: 1px solid rgba(201, 58, 46, 0.12);
      color: #832821;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .result-panel {
      display: grid;
      gap: 16px;
    }

    .result-summary {
      display: grid;
      gap: 16px;
      padding: 22px;
      border-radius: 24px;
      background:
        radial-gradient(circle at top right, rgba(30, 127, 91, 0.12), transparent 18%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(247, 240, 229, 0.92));
      border: 1px solid rgba(87, 58, 48, 0.08);
    }

    .result-kicker {
      display: inline-flex;
      width: fit-content;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(30, 127, 91, 0.1);
      color: #1c6d50;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
    }

    .book-card,
    .route-card {
      display: grid;
      gap: 12px;
      padding: 18px;
      border-radius: 22px;
      border: 1px solid rgba(87, 58, 48, 0.08);
      background: rgba(255, 255, 255, 0.88);
      min-width: 0;
    }

    .book-spread {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .book-page {
      position: relative;
      min-height: 180px;
      padding: 16px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(252, 247, 240, 0.98), rgba(245, 235, 223, 0.92));
      border: 1px solid rgba(87, 58, 48, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
      overflow: hidden;
    }

    .book-page::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 18px;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(113, 84, 74, 0.24), transparent);
    }

    .book-page strong {
      display: block;
      margin-bottom: 8px;
      color: #824427;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .book-page h3 {
      margin: 0 0 6px;
      font-size: 1.04rem;
      color: #3d271f;
      line-height: 1.25;
    }

    .book-page p {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.55;
      color: rgba(63, 42, 36, 0.74);
    }

    .route-list {
      display: grid;
      gap: 10px;
    }

    .route-item {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 12px 0;
      border-top: 1px dashed rgba(87, 58, 48, 0.12);
    }

    .route-item:first-child {
      border-top: none;
      padding-top: 0;
    }

    .route-step {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: rgba(201, 58, 46, 0.08);
      color: #8e2a1f;
      font-weight: 900;
    }

    .route-item strong {
      display: block;
      font-size: 0.96rem;
      color: #28473d;
      margin-bottom: 4px;
    }

    .route-item p {
      margin: 0;
      font-size: 0.9rem;
      color: rgba(63, 42, 36, 0.74);
      line-height: 1.55;
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(87, 58, 48, 0.08);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #cb4638, #d9a441);
      transition: width 0.3s ease;
    }

    .helper-note {
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(217, 164, 65, 0.1);
      border: 1px solid rgba(217, 164, 65, 0.14);
      color: #754d16;
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .footer {
      text-align: center;
      padding: 0 20px 36px;
      color: rgba(63, 42, 36, 0.64);
      font-size: 0.92rem;
    }

    @media (max-width: 1080px) {
      .experience-grid,
      .result-grid {
        grid-template-columns: 1fr;
      }

      .board-panel {
        position: static;
      }
    }

    @media (max-width: 760px) {
      .choice-grid,
      .book-spread,
      .logo-showcase {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      header { padding-top: env(safe-area-inset-top); }
      .shell { padding: 0 16px; }
      .nav {
        gap: 8px;
        padding: 10px 0;
      }
      .nav-primary {
        align-items: center;
        gap: 10px;
        min-height: 42px;
      }
      .brand img {
        width: 44px;
        height: 44px;
        border-radius: 12px;
      }
      .brand-copy strong,
      .brand-copy span {
        display: none;
      }
      .nav-mobile-tools {
        gap: 6px;
      }
      .nav-mobile-tools .lang-toggle {
        gap: 4px;
        padding: 3px;
      }
      .nav-mobile-tools .lang-btn {
        min-width: 42px;
        min-height: 42px;
        padding: 7px 0;
        font-size: 0.82rem;
      }
      .nav-toggle { display: inline-flex; }
      .nav-actions {
        width: 100%;
        display: none;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-top: 10px;
        padding: 14px;
        border-radius: 20px;
        border: 1px solid rgba(226, 232, 240, 0.84);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.96));
        box-shadow: var(--menu-shadow);
        backdrop-filter: blur(12px);
      }
      header.nav-open .nav-actions {
        display: grid;
        animation: mobileNavFade 0.22s ease both;
      }
      .nav-actions > * {
        width: 100%;
      }
      .nav-actions > .pill,
      .nav-actions > .button,
      .nav-actions > button {
        min-height: 46px;
        padding: 12px 14px;
        border-radius: 16px;
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.2;
      }
      .nav-actions .lang-toggle {
        display: none;
      }
      main { padding-top: 16px; }
      .hero,
      .control-panel {
        padding: 18px;
      }
      .logo-showcase-card {
        min-height: 112px;
        padding: 14px 16px;
        border-radius: 18px;
      }
      .logo-showcase-card img {
        height: 60px;
      }
      .board-panel {
        padding: 14px;
      }
      .board-frame {
        border-radius: 28px;
      }
      .choice-btn {
        min-height: 128px;
      }
      .status-row,
      .result-actions {
        align-items: stretch;
      }
      .result-actions .button,
      .result-actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell nav">
      <div class="nav-primary">
        <div class="brand">
          <img src="../Enter.PNG" alt="JCI Peninsula logo" />
          <div class="brand-copy">
            <strong data-i18n="header.title">Blue Sky Returns</strong>
            <span data-i18n="header.subtitle">Decision board experience</span>
          </div>
        </div>
        <div class="nav-mobile-tools">
          <div class="lang-toggle" role="group" aria-label="Language switcher">
            <button class="lang-btn active" type="button" data-lang="zh">中文</button>
            <button class="lang-btn" type="button" data-lang="en">EN</button>
          </div>
          <button id="navToggleBtn" class="nav-toggle" type="button" aria-expanded="false" data-i18n="nav.menu">選單</button>
        </div>
      </div>
      <div id="navActions" class="nav-actions">
        <a class="pill" href="./index.html" data-i18n="nav.about">項目介紹</a>
        <a class="pill" href="./eco-mbti.html" data-i18n="nav.mbti">Eco-MBTI</a>
        <a class="pill" href="./green-action-7day.html" data-i18n="nav.daily">每日行動</a>
        <a class="pill active" href="./decision-board.html" data-i18n="nav.decision">決策板</a>
        <div class="lang-toggle" role="group" aria-label="Language switcher">
          <button class="lang-btn active" type="button" data-lang="zh">中文</button>
          <button class="lang-btn" type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

            <line x1="${mid}" y1="${y - 32}" x2="${mid}" y2="${y - 14}" stroke="rgba(85,16,13,0.82)" stroke-width="4" stroke-linecap="round" />
            <path d="M ${railLeft + offset} ${y} L ${mid} ${y - 18} L ${railRight - offset} ${y}" fill="none" stroke="rgba(85,16,13,0.82)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M ${railLeft + offset} ${y + 24} L ${mid} ${y + 6} L ${railRight - offset} ${y + 24}" fill="none" stroke="rgba(85,16,13,0.82)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        `;
      }).join("");

      boardSvg.innerHTML = `
        <defs>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="rgba(68,10,8,0.18)" />
          </filter>
        </defs>
        <circle cx="210" cy="44" r="7" fill="rgba(90,18,14,0.82)" />
        <line x1="210" y1="50" x2="210" y2="68" stroke="rgba(90,18,14,0.82)" stroke-width="4" stroke-linecap="round" />
        ${segments}
        <g filter="url(#shadow)">
          <circle cx="${laneX.left}" cy="552" r="7" fill="rgba(90,18,14,0.82)" />
          <circle cx="${laneX.middle}" cy="552" r="7" fill="rgba(90,18,14,0.82)" />
          <circle cx="${laneX.right}" cy="552" r="7" fill="rgba(90,18,14,0.82)" />
        </g>
      `;
    };

    const saveState = () => {
      localStorage.setItem(STATE_STORAGE_KEY, JSON.stringify({ currentStep, answers }));
    };

    const loadState = () => {
      try {
        const raw = localStorage.getItem(STATE_STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.answers)) answers = parsed.answers.slice(0, QUESTIONS.length);
        currentStep = Math.min(Number(parsed.currentStep || 0), QUESTIONS.length);
      } catch (error) {
        console.error("Failed to load decision board state:", error);
      }
    };

    const getTokenPosition = () => {
      if (!answers.length) return { left: 210, top: boardRows[0] };
      const last = answers[Math.min(answers.length - 1, boardRows.length - 1)];
      return {
        left: laneX[last.lane] || 210,
        top: boardRows[Math.min(answers.length, boardRows.length - 1)]
      };
    };

    const updateToken = () => {
      const pos = getTokenPosition();
      boardToken.style.left = `${(pos.left / 420) * 100}%`;
      boardToken.style.top = `${(pos.top / 620) * 100}%`;
    };

    const getRouteKey = () => {
      const totals = answers.reduce((acc, answer) => {
        Object.entries(answer.score || {}).forEach(([key, value]) => {
          acc[key] = (acc[key] || 0) + value;
        });
        return acc;
      }, { spark: 0, weave: 0, root: 0 });
      return Object.entries(totals).sort((a, b) => b[1] - a[1])[0]?.[0] || "spark";
    };

    const getPathLabel = () => {
      if (!answers.length) return t("status.pathEmpty");
      return `${t("status.pathPrefix")} ${answers.map((answer) => laneLabels[answer.lane]).join(" · ")}`;
    };

    const animateAndAdvance = async (option) => {
      answers.push({ lane: option.lane, score: option.score });
      currentStep += 1;
      saveState();
      updateToken();
      updateStatus();
      await new Promise((resolve) => window.setTimeout(resolve, 420));
      renderCurrentState();
    };

    const resetExperience = () => {
      currentStep = 0;
      answers = [];
      saveState();
      resultPanel.hidden = true;
      questionCard.hidden = false;
      updateToken();
      renderCurrentState();
    };

    const buildCopyText = () => {
      const route = ROUTES[getRouteKey()][currentLang];
      const path = answers.map((answer) => laneLabels[answer.lane]).join(" · ");
      if (currentLang === "zh") {
        return `我的 Decision Board 結果是：${route.name}\n路徑：${path}\n摘要：${route.summary}`;
      }
      return `My Decision Board result: ${route.name}\nPath: ${path}\nSummary: ${route.summary}`;
    };

    const copySummary = async () => {
      const text = buildCopyText();
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          alert(t("result.copied"));
          return;
        }
      } catch (error) {
        console.error(error);
      }
      alert(`${t("result.fallback")}\n\n${text}`);
    };

    const updateStatus = () => {
      const total = QUESTIONS.length;
      const completed = Math.min(currentStep, total);
      stepBadge.textContent = format(t("status.step"), { current: Math.min(completed + 1, total), total });
      pathBadge.textContent = getPathLabel();
      progressBar.style.width = `${(completed / total) * 100}%`;
    };

    const renderQuestion = () => {
      const question = QUESTIONS[currentStep];
      const copy = question[currentLang];
      questionCard.hidden = false;
      resultPanel.hidden = true;
      questionCard.innerHTML = `
        <div class="question-copy">
          <span class="mini-badge">${t("controls.choose")}</span>
          <h2>${copy.title}</h2>
          <p>${copy.body}</p>
        </div>
        <div class="choice-grid">
          ${copy.options.map((option, index) => `
            <button class="choice-btn" type="button" data-option-index="${index}">
              <strong>${option.title}</strong>
              <span>${option.body}</span>
            </button>
          `).join("")}
        </div>
        <div class="path-strip">
          ${answers.map((answer, index) => `<span class="path-pill">${index + 1}. ${laneLabels[answer.lane]}</span>`).join("")}
        </div>
      `;
      questionCard.querySelectorAll(".choice-btn").forEach((button) => {
        button.addEventListener("click", () => {
          const option = copy.options[Number(button.dataset.optionIndex)];
          animateAndAdvance(option);
        });
      });
    };

    const renderResult = () => {
      const route = ROUTES[getRouteKey()][currentLang];
      const summaryTitle = format(t("result.title"), { route: route.name });
      questionCard.hidden = true;
      resultPanel.hidden = false;
      stepBadge.textContent = t("result.routeLabel");
      pathBadge.textContent = getPathLabel();
      progressBar.style.width = "100%";

      resultPanel.innerHTML = `
        <div class="result-summary">
          <span class="result-kicker">${t("result.kicker")}</span>
          <h2>${summaryTitle}</h2>
          <p>${t("result.summary")}</p>
          <div class="helper-note">${route.summary}</div>
          <div class="result-actions">
            <button id="restartBtn" class="primary" type="button">${t("result.action")}</button>
            <button id="copyBtn" type="button">${t("result.share")}</button>
          </div>
        </div>
        <div class="result-grid">
          <div class="book-card">
            <h3>${t("result.nextTitle")}</h3>
            <div class="book-spread">
              ${route.pages.map((page) => `
                <article class="book-page">
                  <strong>${page.label}</strong>
                  <h3>${page.title}</h3>
                  <p>${page.body}</p>
                </article>
              `).join("")}
            </div>
          </div>
          <div class="route-card">
            <h3>${t("result.routeTitle")}</h3>
            <div class="route-list">
              ${route.steps.map((step, index) => `
                <div class="route-item">
                  <div class="route-step">${index + 1}</div>
                  <div>
                    <strong>${step.title}</strong>
                    <p>${step.body}</p>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;

      document.getElementById("restartBtn").addEventListener("click", resetExperience);
      document.getElementById("copyBtn").addEventListener("click", copySummary);
    };

    const renderCurrentState = () => {
      updateStatus();
      if (currentStep >= QUESTIONS.length) {
        renderResult();
      } else {
        renderQuestion();
      }
    };

    const applyLanguage = (lang) => {
      currentLang = lang === "en" ? "en" : "zh";
      localStorage.setItem(LANG_STORAGE_KEY, currentLang);
      document.documentElement.lang = currentLang === "zh" ? "zh-Hant" : "en";
      document.title = t("page.title");

      const walk = (prefix, value) => {
        Object.entries(value).forEach(([key, nested]) => {
          const path = prefix ? `${prefix}.${key}` : key;
          if (nested && typeof nested === "object" && !Array.isArray(nested)) {
            walk(path, nested);
            return;
          }
          document.querySelectorAll(`[data-i18n="${path}"]`).forEach((node) => {
            node.textContent = nested;
          });
        });
      };

      walk("", I18N[currentLang]);
      document.querySelectorAll(".lang-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === currentLang);
      });
      setNavToggleLabel(siteHeader.classList.contains("nav-open"));
      renderCurrentState();
    };

    document.querySelectorAll(".lang-btn").forEach((button) => {
      button.addEventListener("click", () => applyLanguage(button.dataset.lang));
    });

    renderBoard();
    loadState();
    updateToken();
    applyLanguage(currentLang);
  </script>
</body>
</html>
