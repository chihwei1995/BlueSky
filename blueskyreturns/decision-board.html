<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decision Board | Blue Sky Returns</title>
  <link rel="icon" type="image/png" href="/Enter.PNG" />
  <link rel="shortcut icon" type="image/png" href="/Enter.PNG" />
  <link rel="apple-touch-icon" href="/Enter.PNG" />
  <meta name="description" content="A playful animated decision board that reveals a random booth result for Blue Sky Returns." />
  <style>
    :root {
      --paper: #f7f0e6;
      --paper-ink: #3f2a24;
      --board: #e43d35;
      --board-deep: #c92c25;
      --board-line: #5a5551;
      --card: rgba(255, 251, 246, 0.9);
      --line: rgba(87, 58, 48, 0.12);
      --shadow: 0 24px 56px rgba(79, 45, 32, 0.14);
      --menu-shadow: 0 20px 44px rgba(15, 23, 42, 0.14);
      --accent: #1e7f5b;
      --accent-soft: #def2e7;
      --gold: #d9a441;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--paper-ink);
      background:
        radial-gradient(circle at top left, rgba(217, 164, 65, 0.16), transparent 18%),
        radial-gradient(circle at top right, rgba(205, 64, 50, 0.12), transparent 16%),
        linear-gradient(180deg, #fbf6ef 0%, #f6efe5 52%, #f4ecdf 100%);
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(14px);
      background: rgba(251, 246, 239, 0.9);
      border-bottom: 1px solid rgba(87, 58, 48, 0.08);
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      flex-wrap: nowrap;
    }

    .nav-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex: 1 1 auto;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
      padding: 5px;
      border: 1px solid rgba(87, 58, 48, 0.1);
      box-shadow: 0 10px 18px rgba(64, 42, 34, 0.1);
    }

    .brand-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand-copy strong {
      color: #234b3f;
      font-size: 1rem;
      letter-spacing: 0.03em;
    }

    .brand-copy span {
      color: rgba(63, 42, 36, 0.72);
      font-size: 0.84rem;
    }

    .nav-mobile-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      min-width: 0;
      justify-content: flex-end;
    }

    .pill,
    .button,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
      border-radius: 999px;
      border: 1px solid rgba(87, 58, 48, 0.12);
      background: rgba(255, 255, 255, 0.86);
      color: #244d41;
      padding: 10px 14px;
      font-size: 0.94rem;
      line-height: 1.35;
      text-align: center;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .pill:hover,
    .button:hover,
    button:hover {
      transform: translateY(-1px);
      border-color: rgba(30, 127, 91, 0.3);
      box-shadow: 0 10px 22px rgba(30, 127, 91, 0.12);
    }

    .pill.active,
    .button.primary,
    button.primary {
      background: linear-gradient(135deg, #1e7f5b, #51aa89);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 12px 24px rgba(30, 127, 91, 0.18);
    }

    .lang-toggle {
      display: inline-flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid rgba(87, 58, 48, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: rgba(63, 42, 36, 0.68);
      padding: 7px 12px;
      border-radius: 999px;
      font-weight: 700;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, #1e7f5b, #51aa89);
      color: #fff;
      box-shadow: 0 8px 18px rgba(30, 127, 91, 0.16);
    }

    .nav-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(255, 255, 255, 0.92);
      color: #16324f;
      font-size: 0.92rem;
      line-height: 1;
      letter-spacing: 0.01em;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      white-space: nowrap;
    }

    @keyframes mobileNavFade {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nav-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.24);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 29;
    }

    .nav-backdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    main {
      padding: 28px 0 56px;
    }

    .board-stage {
      display: grid;
      gap: 0;
      justify-items: center;
    }

    .board-frame {
      width: min(100%, 720px);
      padding: 24px 24px 26px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 14%),
        linear-gradient(180deg, var(--board), var(--board-deep));
      background-image:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 14%),
        url("../assets/decision-board-texture.png"),
        linear-gradient(180deg, var(--board), var(--board-deep));
      background-size: 100% 100%, 100% 100%, 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      border: 1px solid rgba(116, 26, 22, 0.42);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        inset 0 -16px 24px rgba(104, 18, 14, 0.2),
        0 24px 48px rgba(93, 32, 24, 0.2);
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
    }

    .board-frame.is-celebrating {
      animation: boardCelebrate 1.8s ease-in-out infinite;
    }

    @keyframes boardCelebrate {
      0%, 100% {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          inset 0 -16px 24px rgba(104, 18, 14, 0.2),
          0 24px 48px rgba(93, 32, 24, 0.2);
      }
      50% {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          inset 0 -16px 24px rgba(104, 18, 14, 0.2),
          0 0 0 6px rgba(255, 206, 92, 0.16),
          0 0 42px rgba(255, 191, 72, 0.38),
          0 24px 48px rgba(93, 32, 24, 0.26);
      }
    }

    .board-title {
      display: none;
    }

    .board-svg {
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      pointer-events: none;
    }

    .board-token {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #fff7d6 0%, #f1ca6f 40%, #ba7d13 100%);
      box-shadow:
        0 6px 14px rgba(62, 17, 12, 0.26),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(101, 50, 4, 0.4);
      transform: translate(-50%, -50%);
      transition: left 0.14s linear, top 0.14s linear;
      z-index: 3;
      cursor: pointer;
    }

    .board-token.ready {
      animation: pulseBall 1.6s ease-in-out infinite;
    }

    @keyframes pulseBall {
      0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 6px 14px rgba(62, 17, 12, 0.26), inset 0 1px 2px rgba(255, 255, 255, 0.4); }
      50% { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 10px 22px rgba(62, 17, 12, 0.34), inset 0 1px 2px rgba(255, 255, 255, 0.4); }
    }

    .board-callout {
      position: absolute;
      top: 18px;
      left: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(61, 16, 13, 0.26);
      color: rgba(255, 246, 240, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.88rem;
      font-weight: 800;
      z-index: 2;
      backdrop-filter: blur(6px);
    }

    .board-launch {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      display: grid;
      gap: 14px;
      justify-items: center;
      width: min(88%, 320px);
      text-align: center;
      transition: opacity 0.24s ease, transform 0.24s ease;
    }

    .board-launch[hidden] {
      display: none;
    }

    .board-launch-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 248, 243, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff8f3;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      backdrop-filter: blur(8px);
    }

    .board-launch button {
      min-width: 236px;
      min-height: 84px;
      padding: 18px 26px;
      border-radius: 999px;
      border: 1px solid rgba(122, 25, 20, 0.18);
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 228, 214, 0.92), transparent 38%),
        linear-gradient(180deg, #e55949 0%, #c93527 56%, #941d14 100%);
      color: #fffdf9;
      font-size: 1.16rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-shadow: 0 2px 8px rgba(87, 17, 12, 0.34);
      box-shadow:
        0 16px 0 #7b170f,
        0 24px 32px rgba(79, 18, 13, 0.24),
        inset 0 2px 0 rgba(255, 255, 255, 0.36),
        inset 0 -6px 10px rgba(98, 17, 11, 0.26);
    }

    .board-launch button:hover {
      transform: translateY(2px);
      box-shadow:
        0 12px 0 #7b170f,
        0 20px 28px rgba(79, 18, 13, 0.28),
        inset 0 2px 0 rgba(255, 255, 255, 0.4),
        inset 0 -6px 10px rgba(98, 17, 11, 0.26);
    }

    .board-launch p {
      margin: 0;
      max-width: 28ch;
      color: rgba(255, 242, 236, 0.92);
      font-size: 0.92rem;
      line-height: 1.55;
      text-shadow: 0 1px 10px rgba(70, 14, 11, 0.22);
    }

    .board-legend {
      position: absolute;
      bottom: 18px;
      left: 18px;
      right: 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      z-index: 2;
    }

    .legend-chip {
      display: grid;
      gap: 4px;
      justify-items: center;
      padding: 10px 8px;
      border-radius: 18px;
      background: rgba(57, 16, 14, 0.18);
      color: rgba(255, 245, 238, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(6px);
      text-align: center;
    }

    .board-legend {
      display: none;
    }

    .legend-chip strong {
      font-size: 1rem;
      line-height: 1;
    }

    .legend-chip span {
      font-size: 0.76rem;
      opacity: 0.88;
      line-height: 1.25;
    }

    .board-status {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 96px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      z-index: 4;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(57, 16, 14, 0.2);
      color: rgba(255, 245, 238, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-weight: 800;
      font-size: 0.84rem;
    }

    .board-result {
      position: absolute;
      inset: 86px 24px 146px;
      display: grid;
      align-content: start;
      gap: 14px;
      z-index: 5;
      pointer-events: none;
    }

    .result-summary {
      display: grid;
      gap: 14px;
      padding: 20px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 241, 188, 0.82), transparent 26%),
        radial-gradient(circle at top right, rgba(255, 182, 60, 0.18), transparent 24%),
        linear-gradient(180deg, rgba(255, 251, 247, 0.99), rgba(246, 236, 224, 0.98));
      border: 1px solid rgba(245, 182, 62, 0.28);
      box-shadow:
        0 0 0 1px rgba(255, 217, 112, 0.3),
        0 0 32px rgba(255, 196, 74, 0.38),
        0 24px 42px rgba(79, 22, 16, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
      pointer-events: auto;
      animation: winnerBurst 1.2s ease;
    }

    @keyframes winnerBurst {
      0% {
        opacity: 0;
        transform: scale(0.82) translateY(22px);
        filter: brightness(1.16);
      }
      55% {
        opacity: 1;
        transform: scale(1.04) translateY(-4px);
        filter: brightness(1.08);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: brightness(1);
      }
    }

    .result-summary h2 {
      margin: 0;
      font-size: clamp(1.45rem, 2.3vw, 2.1rem);
      line-height: 1.08;
      color: #4c261d;
    }

    .result-summary p {
      margin: 0;
      color: rgba(63, 42, 36, 0.78);
      line-height: 1.58;
    }

    .result-line {
      margin: 0;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid rgba(87, 58, 48, 0.1);
      color: rgba(63, 42, 36, 0.84);
      font-size: 0.96rem;
      line-height: 1.55;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.56);
    }

    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 4px;
    }

    .result-fireworks {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 4;
    }

    .result-fireworks span {
      position: absolute;
      width: 160px;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 237, 167, 0.78) 0 6%, transparent 7% 100%),
        conic-gradient(from 0deg, rgba(255, 196, 74, 0.88), transparent 20%, rgba(255, 135, 74, 0.72), transparent 40%, rgba(255, 230, 146, 0.92), transparent 60%, rgba(255, 174, 61, 0.8), transparent 80%, rgba(255, 196, 74, 0.88));
      filter: blur(0.2px);
      opacity: 0;
      transform: scale(0.2);
      animation: fireworkPop 1.4s ease-out forwards;
    }

    .result-fireworks span:nth-child(1) {
      top: 24px;
      left: 14px;
    }

    .result-fireworks span:nth-child(2) {
      top: 32px;
      right: 8px;
      animation-delay: 0.16s;
    }

    .result-fireworks span:nth-child(3) {
      top: 108px;
      left: 50%;
      margin-left: -80px;
      animation-delay: 0.28s;
    }

    @keyframes fireworkPop {
      0% { opacity: 0; transform: scale(0.2); }
      20% { opacity: 0.95; transform: scale(0.58); }
      100% { opacity: 0; transform: scale(1); }
    }

    .footer {
      text-align: center;
      padding: 0 20px 36px;
      color: rgba(63, 42, 36, 0.64);
      font-size: 0.92rem;
    }

    @media (max-width: 760px) {
      .shell {
        padding: 0 14px;
      }
      main {
        padding: 18px 0 36px;
      }
      .board-frame {
        width: min(100%, 520px);
        padding: 14px 14px 16px;
      }
      .board-callout {
        top: 12px;
        left: 12px;
        right: 12px;
        padding: 8px 12px;
        font-size: 0.8rem;
      }
      .board-token {
        width: 18px;
        height: 18px;
      }
      .board-launch {
        width: min(82%, 250px);
        gap: 10px;
      }
      .board-launch-chip {
        padding: 6px 10px;
        font-size: 0.72rem;
      }
      .board-launch button {
        min-height: 68px;
        min-width: 100%;
        font-size: 1rem;
        letter-spacing: 0.08em;
      }
      .board-launch p {
        font-size: 0.82rem;
        max-width: 20ch;
      }
      .board-status {
        left: 14px;
        right: 14px;
        bottom: 14px;
        justify-content: center;
      }
      .status-badge {
        width: 100%;
        justify-content: center;
        padding: 8px 10px;
        font-size: 0.78rem;
      }
      .board-result {
        inset: 64px 10px 56px;
      }
      .result-summary {
        max-height: calc(100% - 4px);
        overflow: auto;
      }
      .footer {
        padding: 0 16px 28px;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 640px) {
      header { padding-top: env(safe-area-inset-top); }
      .shell { padding: 0 12px; }
      .nav {
        gap: 8px;
        padding: 10px 0;
      }
      .nav-primary {
        align-items: center;
        gap: 10px;
        min-height: 42px;
      }
      .brand img {
        width: 44px;
        height: 44px;
        border-radius: 12px;
      }
      .brand-copy strong,
      .brand-copy span {
        display: none;
      }
      .nav-mobile-tools {
        gap: 6px;
      }
      .nav-mobile-tools .lang-toggle {
        gap: 4px;
        padding: 3px;
      }
      .nav-mobile-tools .lang-btn {
        min-width: 42px;
        min-height: 42px;
        padding: 7px 0;
        font-size: 0.82rem;
      }
      .nav-toggle { display: inline-flex; }
      .nav-actions {
        width: 100%;
        display: none;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-top: 10px;
        padding: 14px;
        border-radius: 20px;
        border: 1px solid rgba(226, 232, 240, 0.84);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.96));
        box-shadow: var(--menu-shadow);
        backdrop-filter: blur(12px);
      }
      header.nav-open .nav-actions {
        display: grid;
        animation: mobileNavFade 0.22s ease both;
      }
      .nav-actions > * {
        width: 100%;
      }
      .nav-actions > .pill,
      .nav-actions > .button,
      .nav-actions > button {
        min-height: 46px;
        padding: 12px 14px;
        border-radius: 16px;
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1.2;
      }
      .nav-actions .lang-toggle {
        display: none;
      }
      main { padding-top: 10px; }
      .board-frame {
        width: 100%;
        padding: 12px;
        border-radius: 16px;
      }
      .board-callout {
        top: 10px;
        left: 10px;
        right: 10px;
        padding: 7px 10px;
        font-size: 0.76rem;
        justify-content: center;
        text-align: center;
      }
      .board-launch {
        top: 56%;
        width: min(84%, 228px);
        gap: 8px;
      }
      .board-launch-chip {
        display: none;
      }
      .board-launch button {
        min-height: 62px;
        font-size: 0.96rem;
      }
      .board-launch button,
      .result-actions button {
        width: 100%;
      }
      .board-launch p {
        font-size: 0.78rem;
        line-height: 1.4;
      }
      .board-status {
        left: 10px;
        right: 10px;
        bottom: 10px;
      }
      .board-result {
        inset: 54px 8px 48px;
      }
      .result-summary {
        padding: 14px;
        gap: 10px;
      }
      .result-summary h2 {
        font-size: 1.08rem;
      }
      .result-fireworks span {
        width: 100px;
      }
      .result-line {
        font-size: 0.8rem;
        line-height: 1.42;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell nav">
      <div class="nav-primary">
        <div class="brand">
          <img src="../Enter.PNG" alt="JCI Peninsula logo" />
          <div class="brand-copy">
            <strong data-i18n="header.title">Blue Sky Returns</strong>
            <span data-i18n="header.subtitle">Decision board experience</span>
          </div>
        </div>
        <div class="nav-mobile-tools">
          <div class="lang-toggle" role="group" aria-label="Language switcher">
            <button class="lang-btn active" type="button" data-lang="zh">中文</button>
            <button class="lang-btn" type="button" data-lang="en">EN</button>
          </div>
          <button id="navToggleBtn" class="nav-toggle" type="button" aria-expanded="false" data-i18n="nav.menu">選單</button>
        </div>
      </div>
      <div id="navActions" class="nav-actions">
        <a class="pill" href="./index.html" data-i18n="nav.about">項目介紹</a>
        <a class="pill" href="./eco-mbti.html" data-i18n="nav.mbti">Eco-MBTI</a>

  <script>
    const LANG_STORAGE_KEY = "bsr_decision_board_lang";
    const STATE_STORAGE_KEY = "bsr_decision_board_state";

    const I18N = {
      zh: {

        status: {
          step: "Animation {current} / {total}",
          ready: "Tap once",
          spinning: "Randomizing...",
          landed: "Result ready"
        },
        launch: {

    };

    const ROUTES = {
      spark: {
        zh: {
          name: "剔（回答題目）",
          summary: "請抽一題並作答，答對即可獲得大獎。",
          pages: [
            { label: "PAGE 01", title: "抽題卡", body: "參加者抽出一條青商知識題，瞬間把注意力集中到台前。" },
            { label: "PAGE 02", title: "現場作答", body: "主持人可即時互動、追問、帶節奏，讓其他人也一起猜答案。" },
            { label: "PAGE 03", title: "答對拿大獎", body: "正確回答後直接送出大獎，形成最有張力的一個高潮點。" }
          ],
          steps: [
            { title: "抽一題", body: "請先抽取一條青商知識題。" },
            { title: "直接作答", body: "照你的想法回答即可。" },
            { title: "答對領獎", body: "答對後即可獲得大獎。" }
          ]
        },
        en: {
          name: "Check / Answer Challenge",
          summary: "Draw one question and answer it. Get the grand prize if you are correct.",
          pages: [
            { label: "PAGE 01", title: "Draw a question card", body: "The participant pulls a JCI knowledge question and the crowd immediately focuses in." },
            { label: "PAGE 02", title: "Answer live on site", body: "The host can build suspense, invite guesses, and turn the booth into a small stage moment." },
            { label: "PAGE 03", title: "Win the grand prize", body: "A correct answer leads directly to the big reward and creates the strongest climax." }
          ],
          steps: [
            { title: "Draw a question", body: "Pick one JCI knowledge question." },
            { title: "Answer it", body: "Give your answer right away." },
            { title: "Win the prize", body: "If you are correct, you get the grand prize." }

        }
      },
      weave: {
        zh: {
          name: "重做（再來一次）",
          summary: "你獲得一次重來機會，可以再玩一次。",
          pages: [
            { label: "PAGE 01", title: "全場一起喊重做", body: "不是失敗，而是把結果轉成再次互動的理由。" },
            { label: "PAGE 02", title: "追加一次轉盤或決策機會", body: "讓參加者再玩一次，也讓現場多一次期待感。" },

          ],
          steps: [

            { title: "再按一次", body: "重新啟動決策板。" },
            { title: "看新結果", body: "再看看這次會落到哪裡。" }
          ]
        },
        en: {
          name: "Redo / One More Try",
          summary: "You get one more chance. Tap and play again.",
          pages: [
            { label: "PAGE 01", title: "Let the crowd shout for a redo", body: "The result becomes a reason to keep the game alive instead of ending it." },
            { label: "PAGE 02", title: "Give one extra board or wheel chance", body: "The participant gets another shot and the booth gets another suspense beat." },
            { label: "PAGE 03", title: "Turn noise into attraction", body: "Redo is the best route for laughter, cheering, and repeat crowd attention." }
          ],

            { title: "Lucky redo", body: "You have one extra chance." },

      root: {
        zh: {

            { label: "PAGE 02", title: "直接送出精美禮品", body: "這是最快速也最順的獎勵落點，適合拉快整體節奏。" },
            { label: "PAGE 03", title: "保持流暢人流", body: "因為不用答題或重做，很適合在高峰時快速消化排隊人潮。" }
          ],
          steps: [
            { title: "結果已揭曉", body: "這次落在 X。" },
            { title: "直接領禮物", body: "請前往領取你的精美禮品。" },
            { title: "完成挑戰", body: "你已完成這次互動。" }
          ]
        },
        en: {
          name: "X / I Love Hong Kong",
          summary: "Claim your gift directly.",
          pages: [
            { label: "PAGE 01", title: "Land on X", body: "The host immediately reads it as “I love Hong Kong, China,” with no extra delay." },
            { label: "PAGE 02", title: "Give the participant a nice gift", body: "This is the fastest and most direct reward route." },
            { label: "PAGE 03", title: "Keep the line moving", body: "Because there is no quiz or redo, this route is ideal when traffic is heavy." }
          ],
          steps: [
            { title: "Result revealed", body: "This time you landed on X." },
            { title: "Get your gift", body: "Please collect your gift now." },
            { title: "Done", body: "You have completed this round." }
          ]
        }
      }
    };

    const BOARD_SIZE = 420;
    const RESULT_LANE_MAP = { root: "left", weave: "middle", spark: "right" };
    const RESULT_KEYS = ["root", "weave", "spark"];
    const TOTAL_ANIMATION_STEPS = 9;
    const laneLabels = { left: "X", middle: "↺", right: "✓" };
    const START_POINT = { left: 210, top: 38 };
    const outletLaneX = { left: 52, middle: 210, right: 368 };
    const trackRows = [
      { y: 70, entryY: 50, bendY: 58, glideY: 64, settleY: 70, lanes: { left: 120, middle: 210, right: 300 } },
      { y: 101, entryY: 82, bendY: 88, glideY: 95, settleY: 101, lanes: { left: 98, middle: 210, right: 322 } },
      { y: 132, entryY: 114, bendY: 120, glideY: 126, settleY: 132, lanes: { left: 114, middle: 210, right: 306 } },
      { y: 164, entryY: 145, bendY: 151, glideY: 157, settleY: 164, lanes: { left: 102, middle: 210, right: 318 } },
      { y: 196, entryY: 177, bendY: 183, glideY: 189, settleY: 196, lanes: { left: 116, middle: 210, right: 304 } },
      { y: 228, entryY: 209, bendY: 215, glideY: 221, settleY: 228, lanes: { left: 106, middle: 210, right: 314 } },
      { y: 260, entryY: 241, bendY: 247, glideY: 253, settleY: 260, lanes: { left: 120, middle: 210, right: 300 } },
      { y: 292, entryY: 273, bendY: 279, glideY: 285, settleY: 292, lanes: { left: 110, middle: 210, right: 310 } },
      { y: 324, entryY: 305, bendY: 311, glideY: 318, settleY: 324, lanes: { left: 124, middle: 210, right: 296 } }
    ];
    const exitY = 354;

    const siteHeader = document.querySelector("header");
    const navActions = document.getElementById("navActions");
    const navToggleBtn = document.getElementById("navToggleBtn");
    const navBackdrop = document.getElementById("navBackdrop");
    const boardTitle = document.getElementById("boardTitle");
    const boardFrame = document.querySelector(".board-frame");
    const boardSvg = document.getElementById("boardSvg");
    const boardToken = document.getElementById("boardToken");
    const boardLaunch = document.getElementById("boardLaunch");
    const boardLaunchBtn = document.getElementById("boardLaunchBtn");
    const boardResult = document.getElementById("boardResult");
    const pathBadge = document.getElementById("pathBadge");
    let currentLang = localStorage.getItem(LANG_STORAGE_KEY) || "zh";
    let pathHistory = [];
    let currentResultKey = "";
    let isAnimating = false;

    const t = (path) => String(path || "").split(".").reduce((acc, key) => acc?.[key], I18N[currentLang]) || "";
    const format = (template, values) => template.replace(/\{(\w+)\}/g, (_, key) => values[key] ?? "");

    const setNavToggleLabel = (isOpen) => {
      navToggleBtn.textContent = isOpen ? "Close / 關閉" : t("nav.menu");
    };

    const closeMobileNav = () => {
      siteHeader.classList.remove("nav-open");
      navToggleBtn.setAttribute("aria-expanded", "false");
      navBackdrop.classList.remove("is-visible");
      setNavToggleLabel(false);
    };

    navToggleBtn.addEventListener("click", () => {
      const nextOpen = !siteHeader.classList.contains("nav-open");
      siteHeader.classList.toggle("nav-open", nextOpen);
      navToggleBtn.setAttribute("aria-expanded", nextOpen ? "true" : "false");
      navBackdrop.classList.toggle("is-visible", nextOpen);
      setNavToggleLabel(nextOpen);
    });

    navBackdrop.addEventListener("click", closeMobileNav);
    navActions.querySelectorAll("a, button").forEach((node) => node.addEventListener("click", closeMobileNav));
    window.addEventListener("resize", () => {
      if (window.innerWidth > 640) closeMobileNav();
    });

    const renderBoard = () => {
      const segments = trackRows.map((row) => {
        const railLeft = row.lanes.left - 62;
        const railRight = row.lanes.right + 62;
        const mid = row.lanes.middle;
        const y = row.y;
        return `
          <g>
            <line x1="${mid}" y1="${y - 28}" x2="${mid}" y2="${y - 14}" stroke="url(#trackMetal)" stroke-width="14" stroke-linecap="round" />
            <line x1="${railLeft}" y1="${y}" x2="${mid}" y2="${y - 16}" stroke="url(#trackMetal)" stroke-width="14" stroke-linecap="round" />
            <line x1="${mid}" y1="${y - 16}" x2="${railRight}" y2="${y}" stroke="url(#trackMetal)" stroke-width="14" stroke-linecap="round" />
            <line x1="${railLeft}" y1="${y + 22}" x2="${mid}" y2="${y + 6}" stroke="url(#trackMetal)" stroke-width="14" stroke-linecap="round" />
            <line x1="${mid}" y1="${y + 6}" x2="${railRight}" y2="${y + 22}" stroke="url(#trackMetal)" stroke-width="14" stroke-linecap="round" />
          </g>
        `;
      }).join("");

      boardSvg.innerHTML = `
        <defs>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="rgba(68,10,8,0.12)" />
          </filter>
          <filter id="trackDepth" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.28)" />
            <feDropShadow dx="0" dy="-1" stdDeviation="1" flood-color="rgba(255,255,255,0.12)" />
          </filter>
          <linearGradient id="trackMetal" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#99908a" />
            <stop offset="38%" stop-color="#5f5955" />
            <stop offset="68%" stop-color="#45403c" />
            <stop offset="100%" stop-color="#7f7771" />
          </linearGradient>
        </defs>
        <circle cx="${START_POINT.left}" cy="${START_POINT.top}" r="8" fill="#3b3532" />
        <line x1="${START_POINT.left}" y1="${START_POINT.top + 8}" x2="${START_POINT.left}" y2="72" stroke="#3b3532" stroke-width="5" stroke-linecap="round" />
        <g filter="url(#trackDepth)">${segments}</g>
        <g filter="url(#shadow)">
          <line x1="${outletLaneX.left - 28}" y1="358" x2="${outletLaneX.left + 28}" y2="358" stroke="url(#trackMetal)" stroke-width="16" stroke-linecap="round" />
          <line x1="${outletLaneX.middle - 28}" y1="358" x2="${outletLaneX.middle + 28}" y2="358" stroke="url(#trackMetal)" stroke-width="16" stroke-linecap="round" />
          <line x1="${outletLaneX.right - 28}" y1="358" x2="${outletLaneX.right + 28}" y2="358" stroke="url(#trackMetal)" stroke-width="16" stroke-linecap="round" />
        </g>
      `;
    };

    const saveState = () => {
      localStorage.setItem(STATE_STORAGE_KEY, JSON.stringify({ pathHistory, currentResultKey }));
    };

    const loadState = () => {
      try {
        const raw = localStorage.getItem(STATE_STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.pathHistory)) pathHistory = parsed.pathHistory.slice(0, TOTAL_ANIMATION_STEPS);
        currentResultKey = typeof parsed.currentResultKey === "string" ? parsed.currentResultKey : "";
      } catch (error) {
        console.error("Failed to load decision board state:", error);
      }
    };

    const setTokenPosition = ({ left, top }) => {
      boardToken.style.left = `${(left / BOARD_SIZE) * 100}%`;
      boardToken.style.top = `${(top / BOARD_SIZE) * 100}%`;
    };

    const randomLane = () => ["left", "middle", "right"][Math.floor(Math.random() * 3)];

    const buildRandomPath = (resultKey) => {
      const path = [];
      for (let i = 0; i < TOTAL_ANIMATION_STEPS - 1; i += 1) {
        path.push(randomLane());
      }
      path.push(RESULT_LANE_MAP[resultKey] || "right");
      return path;
    };

    const buildAnimationPoints = (path) => {
      const points = [{ left: START_POINT.left, top: START_POINT.top }];
      let currentX = START_POINT.left;

      path.forEach((lane, index) => {
        const row = trackRows[index];
        const targetX = row?.lanes?.[lane] || 210;
        points.push({ left: currentX, top: row?.entryY || 210 });
        points.push({ left: currentX + (targetX - currentX) * 0.28, top: row?.bendY || 210 });
        points.push({ left: currentX + (targetX - currentX) * 0.58, top: row?.glideY || 210 });
        points.push({ left: currentX + (targetX - currentX) * 0.82, top: (row?.settleY || 210) - 2 });
        points.push({ left: targetX, top: row?.settleY || 210, commit: lane });
        currentX = targetX;
      });

      const finalLane = path[path.length - 1] || "middle";
      const finalX = outletLaneX[finalLane] || 210;
      points.push({ left: currentX, top: 338 });
      points.push({ left: currentX + (finalX - currentX) * 0.34, top: 344 });
      points.push({ left: currentX + (finalX - currentX) * 0.72, top: 350 });
      points.push({ left: finalX, top: exitY });
      return points;
    };

    const getPathLabel = () => {
      return isAnimating ? t("status.spinning") : t("status.ready");
    };

    const buildCopyText = () => {
      const route = ROUTES[currentResultKey || "spark"][currentLang];
      const path = pathHistory.map((lane) => laneLabels[lane]).join(" · ");
      if (currentLang === "zh") {
        return `我的 Decision Board 結果是：${route.name}\n路徑：${path}\n摘要：${route.summary}`;
      }
      return `My Decision Board result: ${route.name}\nPath: ${path}\nSummary: ${route.summary}`;
    };

    const copySummary = async () => {
      const text = buildCopyText();
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          alert(t("result.copied"));
          return;
        }
      } catch (error) {
        console.error(error);
      }
      alert(`${t("result.fallback")}\n\n${text}`);
    };

    const updateStatus = () => {
      pathBadge.textContent = currentResultKey ? t("status.landed") : getPathLabel();
    };

    const renderLaunchState = () => {
      boardLaunch.hidden = Boolean(currentResultKey || isAnimating);
      boardLaunchBtn.disabled = isAnimating;
      boardLaunchBtn.textContent = isAnimating ? t("status.spinning") : t("launch.start");
    };

    const renderResult = () => {
      const route = ROUTES[currentResultKey || "spark"][currentLang];
      const summaryTitle = format(t("result.title"), { route: route.name });
      boardResult.hidden = false;
      boardResult.innerHTML = `
        <div class="result-fireworks" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="result-summary">
          <h2>${summaryTitle}</h2>
          <p class="result-line">${route.summary}</p>
          <div class="result-actions">
            <button id="restartBtn" class="primary" type="button">${t("result.action")}</button>
          </div>
        </div>
      `;

      document.getElementById("restartBtn").addEventListener("click", resetExperience);
    };

    const renderCurrentState = () => {
      updateStatus();
      renderLaunchState();
      boardFrame.classList.toggle("is-celebrating", Boolean(currentResultKey));
      if (currentResultKey) {
        renderResult();
      } else {
        boardResult.hidden = true;
        boardResult.innerHTML = "";
      }
      boardToken.classList.toggle("ready", !isAnimating && !pathHistory.length);
    };

    const runRandomDraw = async () => {
      if (isAnimating) return;
      isAnimating = true;
      currentResultKey = "";
      pathHistory = [];
      boardResult.hidden = true;
      boardResult.innerHTML = "";
      renderCurrentState();

      const finalResult = RESULT_KEYS[Math.floor(Math.random() * RESULT_KEYS.length)];
      const path = buildRandomPath(finalResult);
      const points = buildAnimationPoints(path);

      for (let i = 1; i < points.length; i += 1) {
        const point = points[i];
        setTokenPosition(point);

        if (point.commit) {
          pathHistory.push(point.commit);
          updateStatus();
          saveState();
        }

        await new Promise((resolve) => window.setTimeout(resolve, i === points.length - 1 ? 360 : 120));
      }

      currentResultKey = finalResult;
      isAnimating = false;
      saveState();
      renderCurrentState();
    };

    const resetExperience = () => {
      pathHistory = [];
      currentResultKey = "";
      isAnimating = false;
      saveState();
      setTokenPosition(START_POINT);
      renderCurrentState();
    };

    const applyLanguage = (lang) => {
      currentLang = lang === "en" ? "en" : "zh";
      localStorage.setItem(LANG_STORAGE_KEY, currentLang);
      document.documentElement.lang = currentLang === "zh" ? "zh-Hant" : "en";
      document.title = t("page.title");

      const walk = (prefix, value) => {
        Object.entries(value).forEach(([key, nested]) => {
          const path = prefix ? `${prefix}.${key}` : key;
          if (nested && typeof nested === "object" && !Array.isArray(nested)) {
            walk(path, nested);
            return;
          }
          document.querySelectorAll(`[data-i18n="${path}"]`).forEach((node) => {
            node.textContent = nested;
          });
        });
      };

      walk("", I18N[currentLang]);
      boardTitle.textContent = t("board.title");
      document.querySelectorAll(".lang-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === currentLang);
      });
      setNavToggleLabel(siteHeader.classList.contains("nav-open"));
      renderCurrentState();
    };

    document.querySelectorAll(".lang-btn").forEach((button) => {
      button.addEventListener("click", () => applyLanguage(button.dataset.lang));
    });

    boardToken.addEventListener("click", runRandomDraw);
    boardLaunchBtn.addEventListener("click", runRandomDraw);

    renderBoard();
    loadState();
    if (pathHistory.length) {
      const rowIndex = Math.min(pathHistory.length - 1, trackRows.length - 1);
      const lastLane = pathHistory[rowIndex];
      const row = trackRows[rowIndex];
      setTokenPosition({ left: row?.lanes?.[lastLane] || 210, top: row?.settleY || 210 });
    } else {
      setTokenPosition(START_POINT);
    }
    applyLanguage(currentLang);
  </script>
</body>
